<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RU29/Barbados Ocean Model Currents</title>
  <style>
    :root {
      --primary: #CC0033;
      --primary-dark: #A00028;
      --sidebar-width: 210px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f0f0f0; color: #111; }

    /* ── Navbar ── */
    .navbar {
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 1rem;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .hamburger {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      margin-right: 0.5rem;
      line-height: 1;
      display: none;
    }

    /* ── Body layout ── */
    #body-row {
      display: flex;
      min-height: calc(100vh - 52px);
    }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-width);
      background: #fff;
      border-right: 1px solid #ddd;
      flex-shrink: 0;
      padding: 1rem 0;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1rem;
      margin: 0.15rem 0.6rem;
      border-radius: 6px;
      color: #1e293b;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar-link:hover { background: #fff5f7; }
    .sidebar-link.active { background: var(--primary); color: #fff; }

    /* ── Overlay (mobile only) ── */
    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 150;
    }

    /* ── Main content ── */
    #main-content {
      flex: 1;
      padding: 1.25rem;
      min-width: 0;
      background: #fff;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .section-label {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      padding: 1.2rem 0 0.4rem;
    }

    .carousel { border-top: 2px solid #eee; margin-top: 0.5rem; }
    .carousel:first-of-type { border-top: none; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      border-bottom: 2px solid #ccc;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      padding: 0.6rem 1rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: #444;
      white-space: pre-line;
      line-height: 1.3;
      text-align: center;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: #000; }
    .tab-btn.active { color: #000; border-bottom-color: #000; }

    .gallery {
      display: flex;
      justify-content: center;
      padding: 1.25rem;
    }
    .image-frame {
      border: 1px solid #ddd;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      background: #f9f9f9;
    }
    .image-frame img {
      display: block;
      max-width: 100%;
      max-height: 80vh;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .hamburger { display: block; }

      #sidebar {
        position: fixed;
        top: 52px;
        left: 0;
        bottom: 0;
        z-index: 160;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        overflow-y: auto;
      }
      #sidebar.open { transform: translateX(0); }
      #sidebar-overlay.open { display: block; }

      h1 { font-size: 1rem; }

      .tabs {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar { display: none; }

      .tab-btn {
        flex-shrink: 0;
        white-space: nowrap;
        font-size: 0.78rem;
        padding: 0.5rem 0.75rem;
      }

      .gallery { padding: 0.75rem 0.25rem; }
      .image-frame img { max-height: 60vh; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <button class="hamburger" id="menuBtn" aria-label="Open menu">&#9776;</button>
  <a class="navbar-brand" href="https://rucool.marine.rutgers.edu">
    <img src="https://rucool.marine.rutgers.edu/hfradmin/static/img/RU_Cool-favicon-32x32.png"
         width="28" height="28" alt="RUCool" style="border-radius:4px">
    RU29 Mission
  </a>
</nav>

<div id="sidebar-overlay"></div>

<div id="body-row">

  <nav id="sidebar">
    <a href="#" class="sidebar-link active">&#127754; Current Maps</a>
    <a href="https://rucool.marine.rutgers.edu/gliders/" class="sidebar-link" target="_blank">&#128752; Glider Status</a>
    <a href="https://rucool.marine.rutgers.edu" class="sidebar-link" target="_blank">&#127968; RUCool Home</a>
  </nav>

  <main id="main-content">
    <h1>RU29/Barbados &mdash; Ocean Model Currents</h1>

    <p class="section-label">Zoomed Region</p>
    <div class="carousel">
      <div class="tabs" id="tabBar-zoom"></div>
      <div class="gallery">
        <div class="image-frame">
          <img id="mainImage-zoom" src="" alt="" />
        </div>
      </div>
    </div>

    <p class="section-label">Wider Region</p>
    <div class="carousel">
      <div class="tabs" id="tabBar-wide"></div>
      <div class="gallery">
        <div class="image-frame">
          <img id="mainImage-wide" src="" alt="" />
        </div>
      </div>
    </div>
  </main>

</div>

<script>
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');

  function openSidebar()  { sidebar.classList.add('open');    overlay.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

  menuBtn.addEventListener('click', () =>
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar()
  );
  overlay.addEventListener('click', closeSidebar);

  const sharedTabs = [
    { label: "Copernicus\nDepth-Average", alt: "Copernicus Depth-Average Currents" },
    { label: "RTOFS\nDepth-Average",      alt: "RTOFS Depth-Average Currents" },
    { label: "ESPC\nDepth-Average",       alt: "ESPC Depth-Average Currents" },
    { label: "Copernicus\nSurface",       alt: "Copernicus Surface Currents" },
    { label: "RTOFS\nSurface",            alt: "RTOFS Surface Currents" },
    { label: "ESPC\nSurface",             alt: "ESPC Surface Currents" }
  ];

  const allTabs = [
    ...sharedTabs,
    { label: "RU29 vs.\nModel", alt: "RU29 vs. Model Depth-Average Currents" }
  ];

  const zoomImages = [
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_copernicus-depthavg-zoom.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_rtofs-depthavg-zoom.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_espc-depthavg-zoom.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_copernicus-zoom.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_rtofs-zoom.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_espc-zoom.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_depth_avg_current_comparison.png"
  ];

  const wideImages = [
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_copernicus-depthavg.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_rtofs-depthavg.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_espc-depthavg.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_copernicus.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_rtofs.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_espc.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_depth_avg_current_comparison.png"
  ];

  function buildCarousel(tabBarId, imageId, tabs, urls) {
    const tabBar = document.getElementById(tabBarId);
    const mainImage = document.getElementById(imageId);

    function selectTab(index) {
      tabBar.querySelectorAll(".tab-btn").forEach((btn, i) => {
        btn.classList.toggle("active", i === index);
      });
      mainImage.src = urls[index];
      mainImage.alt = tabs[index].alt;
    }

    tabs.forEach((tab, i) => {
      const btn = document.createElement("button");
      btn.className = "tab-btn";
      btn.textContent = tab.label;
      btn.addEventListener("click", () => selectTab(i));
      tabBar.appendChild(btn);
    });

    selectTab(0);
  }

  buildCarousel("tabBar-zoom", "mainImage-zoom", allTabs, zoomImages);
  buildCarousel("tabBar-wide", "mainImage-wide", allTabs, wideImages);
</script>

</body>
</html>
