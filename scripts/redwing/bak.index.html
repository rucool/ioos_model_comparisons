<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>RU29 Ocean Model Currents</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    :root {
      --primary-color: #CC0033;
      --primary-dark: #A00028;
      --light-bg: #f0f0f0;
      --border-color: #e2e8f0;
      --text-dark: #1e293b;
      --sidebar-bg: #ffffff;
      --sidebar-hover: #fff5f7;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background-color: var(--light-bg); }

    body {
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      color: var(--text-dark);
      padding-bottom: 30px;
    }

    /* Navbar */
    .navbar {
      background-color: var(--primary-color);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.3rem;
      color: #ffffff !important;
      gap: 0.75rem;
    }
    .navbar-nav .nav-link {
      color: rgba(255,255,255,0.9) !important;
      padding: 0.5rem 1rem !important;
      border-radius: 6px;
      font-weight: 500;
      transition: var(--transition);
    }
    .navbar-nav .nav-link:hover {
      background-color: rgba(255,255,255,0.15);
      color: #ffffff !important;
    }

    /* Footer bar */
    .footer-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 30px;
      background-color: var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 1.5rem;
      z-index: 1030;
      box-shadow: 0 -1px 4px rgba(0,0,0,0.1);
      color: rgba(255,255,255,0.75);
      font-size: 0.75rem;
    }

    /* Sidebar */
    #sidebar-container {
      width: 230px;
      min-height: calc(100vh - 66px - 30px);
      background-color: var(--sidebar-bg);
      padding: 1rem 0;
      border-right: 1px solid var(--border-color);
      box-shadow: 2px 0 8px rgba(0,0,0,0.05);
      overflow-y: auto;
      flex-shrink: 0;
    }
    #sidebar-container .list-group { border: none; gap: 0.25rem; }
    #sidebar-container .list-group-item {
      border: none;
      background-color: transparent;
      padding: 0.75rem 1rem;
      margin: 0 0.75rem;
      border-radius: 8px;
      color: var(--text-dark);
      font-weight: 500;
      transition: var(--transition);
      cursor: pointer;
      text-decoration: none;
    }
    #sidebar-container .list-group-item:hover {
      background-color: var(--sidebar-hover);
      transform: translateX(4px);
    }
    #sidebar-container .list-group-item.active {
      background-color: var(--primary-color);
      color: #ffffff;
    }
    #sidebar-container .list-group-item.active:hover {
      background-color: var(--primary-dark);
    }
    #sidebar-container .sidebar-submenu { font-size: 0.9rem; }
    #sidebar-container .sidebar-submenu a {
      padding-left: 2.5rem !important;
      border-left: 2px solid transparent;
      margin-left: 0.75rem;
      transition: var(--transition);
      text-decoration: none;
      color: var(--text-dark);
      display: block;
      padding: 0.6rem 1rem;
      border-radius: 6px;
    }
    #sidebar-container .sidebar-submenu a:hover {
      border-left-color: var(--primary-color);
      background-color: var(--sidebar-hover);
    }

    /* Layout row */
    #body-row {
      display: flex;
      min-height: calc(100vh - 66px - 30px);
    }

    /* Main content */
    #main-content {
      flex: 1;
      padding: 1.25rem;
      min-width: 0;
    }

    /* Page title */
    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 1rem;
    }

    /* Outer nav-tabs (Zoomed / Wider) */
    .nav-tabs .nav-link {
      color: var(--text-dark);
      border: none;
      border-bottom: 3px solid transparent;
      background: transparent;
      font-weight: 500;
      padding: 0.5rem 1rem;
    }
    .nav-tabs .nav-link:hover { color: var(--primary-color); }
    .nav-tabs .nav-link.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
      background: transparent;
    }
    .nav-tabs { border-bottom: 2px solid var(--border-color); }

    /* Card */
    .card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card-header {
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      padding: 0 0.75rem;
    }

    /* Inner card-header-tabs (model selector) */
    .card-header-tabs .nav-link {
      font-size: 0.82rem;
      padding: 0.5rem 0.75rem;
      font-weight: 500;
      color: #555;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      margin-bottom: -1px;
    }
    .card-header-tabs .nav-link:hover { color: var(--primary-color); }
    .card-header-tabs .nav-link.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
      background: transparent;
    }

    /* Model image */
    .model-image {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow p-3">
  <a class="navbar-brand d-flex align-items-center" href="https://rucool.marine.rutgers.edu">
    <img src="https://rucool.marine.rutgers.edu/hfradmin/static/img/RU_Cool-favicon-32x32.png"
         width="32" height="32" class="me-2 rounded" alt="RUCool">
    <span>RU29 Mission</span>
  </a>
  <ul class="navbar-nav ms-auto flex-row">
    <li class="nav-item">
      <a class="nav-link" href="https://rucool.marine.rutgers.edu">
        <i class="fas fa-external-link-alt me-1"></i>RUCool
      </a>
    </li>
  </ul>
</nav>

<div id="body-row">

  <!-- Sidebar -->
  <div id="sidebar-container" class="d-none d-lg-flex flex-column">
    <ul class="list-group">
      <a href="#" class="list-group-item d-flex align-items-center gap-2 active" style="border:none;">
        <i class="fas fa-water fa-fw"></i>
        <span>Current Maps</span>
      </a>
      <a href="https://rucool.marine.rutgers.edu/gliders/" class="list-group-item d-flex align-items-center gap-2" style="border:none;" target="_blank">
        <i class="fas fa-satellite fa-fw"></i>
        <span>Glider Status</span>
      </a>
      <a href="https://rucool.marine.rutgers.edu" class="list-group-item d-flex align-items-center gap-2" style="border:none;" target="_blank">
        <i class="fas fa-home fa-fw"></i>
        <span>RUCool Home</span>
      </a>
    </ul>
  </div>

  <!-- Main content -->
  <div id="main-content">

    <p class="page-title">
      <i class="fas fa-water me-2"></i>RU29/Barbados &mdash; Ocean Model Currents
    </p>

    <!-- Outer tabs: Zoomed vs Wider -->
    <ul class="nav nav-tabs mb-3" id="regionTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="zoom-tab"
                data-bs-toggle="tab" data-bs-target="#zoom-pane"
                type="button" role="tab">
          <i class="fas fa-search-plus me-1"></i>Zoomed Region
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="wide-tab"
                data-bs-toggle="tab" data-bs-target="#wide-pane"
                type="button" role="tab">
          <i class="fas fa-globe-americas me-1"></i>Wider Region
        </button>
      </li>
    </ul>

    <div class="tab-content" id="regionTabContent">

      <!-- Zoomed pane -->
      <div class="tab-pane fade show active" id="zoom-pane" role="tabpanel">
        <div class="card">
          <div class="card-header">
            <ul class="nav card-header-tabs" id="tabBar-zoom" role="tablist"></ul>
          </div>
          <div class="card-body text-center p-3">
            <img id="mainImage-zoom" src="" alt="" class="model-image">
          </div>
        </div>
      </div>

      <!-- Wider pane -->
      <div class="tab-pane fade" id="wide-pane" role="tabpanel">
        <div class="card">
          <div class="card-header">
            <ul class="nav card-header-tabs" id="tabBar-wide" role="tablist"></ul>
          </div>
          <div class="card-body text-center p-3">
            <img id="mainImage-wide" src="" alt="" class="model-image">
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="footer-bar">
  Rutgers University Center for Ocean Observing Leadership
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const tabs = [
    { label: "Copernicus Depth-Avg", alt: "Copernicus Depth-Average Currents" },
    { label: "RTOFS Depth-Avg",      alt: "RTOFS Depth-Average Currents" },
    { label: "ESPC Depth-Avg",       alt: "ESPC Depth-Average Currents" },
    { label: "Copernicus Surface",   alt: "Copernicus Surface Currents" },
    { label: "RTOFS Surface",        alt: "RTOFS Surface Currents" },
    { label: "ESPC Surface",         alt: "ESPC Surface Currents" },
  ];

  const zoomImages = [
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_copernicus-depthavg-zoom.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_rtofs-depthavg-zoom.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_espc-depthavg-zoom.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_copernicus-zoom.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_rtofs-zoom.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_espc-zoom.png",
  ];

  const wideImages = [
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_copernicus-depthavg.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_rtofs-depthavg.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_espc-depthavg.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_copernicus.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_rtofs.png",
    "https://rucool.marine.rutgers.edu/media/ru29/ru29_twa_latest_espc.png",
  ];

  function buildCarousel(tabBarId, imageId, urls) {
    const tabBar = document.getElementById(tabBarId);
    const mainImage = document.getElementById(imageId);

    function selectTab(index) {
      tabBar.querySelectorAll(".nav-link").forEach((btn, i) => {
        btn.classList.toggle("active", i === index);
      });
      mainImage.src = urls[index];
      mainImage.alt = tabs[index].alt;
    }

    tabs.forEach((tab, i) => {
      const li = document.createElement("li");
      li.className = "nav-item";
      const btn = document.createElement("button");
      btn.className = "nav-link";
      btn.type = "button";
      btn.textContent = tab.label;
      btn.addEventListener("click", () => selectTab(i));
      li.appendChild(btn);
      tabBar.appendChild(li);
    });

    selectTab(0);
  }

  buildCarousel("tabBar-zoom", "mainImage-zoom", zoomImages);
  buildCarousel("tabBar-wide", "mainImage-wide", wideImages);
</script>

</body>
</html>
