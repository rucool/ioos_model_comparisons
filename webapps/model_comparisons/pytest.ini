[pytest]
# Run from this directory (or `make test-portal`). pythonpath puts the app
# directory first, so `ioos_model_comparisons` resolves to the vendored copy
# exactly as in production.
pythonpath = .
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:mongomock.*
