{% extends "base.html" %}
{% block title %}{{ code }} – IOOS Model Comparisons{% endblock %}
{% block data_channel %}{% endblock %}
{% block scripts %}{% endblock %}

{% block content %}
<div class="container py-5 text-center" style="max-width:36rem">
  <div class="display-4 fw-700" style="color:var(--rutgers-grey)">{{ code }}</div>
  <h1 class="h4 mb-3">{{ title }}</h1>
  <p class="text-muted">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-outline-grey mt-2">Back to dashboard</a>
</div>
{% endblock %}
