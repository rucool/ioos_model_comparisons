# Region 'mexico_pacific'. Exported from legacy regions.py (git 5c7d746) by
# scripts/tools/export_regions_yaml.py. Edit freely — this file is now the
# source of truth for the defaults; MongoDB region_configs (the /regions
# editor) holds runtime overrides on top. Validated by regions_store.validate().
order: 17
name: Eastern Pacific - Mexico
folder: mexico_pacific
# South bound is 10.1 because the RTOFS west dataset starts at ~10.03N.
extent: [-126, -92, 10.1, 33]
figure:
  figsize: [12, 8]
  legend:
    columns: 9
sea_surface_height:
- depth: 0
  limits: [-0.6, 0.7, 0.1]
eez: false
variables:
  salinity:
  - depth: 0
    limits: [33, 34.7, 0.1]
  - depth: 100
    limits: [33.5, 34.9, 0.1]
  - depth: 200
    limits: [33.8, 35.0, 0.1]
  temperature:
  - depth: 0
    limits: [20, 32, 1]
    # 50 m is roughly where the model-vs-obs difference peaks, so this is the
    # level for checking whether CICESE glider data are being assimilated.
    # Range is sized to the warmer CMEMS field (5th-99th percentile ~18-31 C,
    # max ~31.75 C) so its warm areas keep detail. pinned: true keeps
    # update_colorbar_limits.py from re-tuning it off RTOFS percentiles.
  - depth: 50
    limits: [15, 32, 0.5]
    pinned: true
  - depth: 100
    limits: [12, 20, 1]
    # Added alongside 50 m for the Oct 2026 RTOFS-stratification check
    # (Hurricane Trudy / CICESE gliders): RTOFS looked fine at 0/100/200 m
    # but diverged from ESPC/CMEMS/gliders at 50 m and 150 m. Limits sized
    # to the region-subset RTOFS/ESPC 1st-99th percentile (~9-20 C) with
    # headroom, not the full un-subset basin range.
  - depth: 150
    limits: [8, 22, 0.5]
  - depth: 200
    limits: [8, 13, 0.5]
currents:
  bool: true
  depths: [0, 100, 200]
  limits: [0, 1, 0.1]
  coarsen:
    rtofs: 14
    espc: 15
    cmems: 14
    amseas: 13
  kwargs:
    ptype: streamplot
    color: black
    density: 2.25
    linewidth: 0.5
salinity_max:
  limits: [36, 37.5, 0.1]
ocean_heat_content:
  limits: [0, 160, 10]
