# Region 'fiji'. Exported from legacy regions.py (git 5c7d746) by
# scripts/tools/export_regions_yaml.py. Edit freely — this file is now the
# source of truth for the defaults; MongoDB region_configs (the /regions
# editor) holds runtime overrides on top. Validated by regions_store.validate().
order: 25
name: Fiji
folder: fiji
# Extent crosses the antimeridian: 160E to 190E (= 170W), stored in 0-360
# space so ESPC subsetting works directly. The Fiji script uses a custom
# two-part CMEMS loader for the antimeridian.
extent: [139.75, 190.25, -30.25, -4.75]
figure:
  legend:
    columns: 10
  figsize: [14, 8]
sea_surface_height: []
eez: true
variables:
  salinity:
  - depth: 0
    limits: [34.5, 36.0, 0.1]
  - depth: 150
    limits: [34.5, 36.0, 0.1]
  temperature:
  - depth: 0
    limits: [24, 31, 0.5]
  - depth: 150
    limits: [12, 24, 0.5]
currents:
  bool: true
  depths: [0, 1500]
  limits: [0, 1.5, 0.1]
  limits_by_depth:
    1500: [0, 0.4, 0.05]
  coarsen:
    rtofs: 7
    espc: 8
    hafs: 7
    cmems: 8
  kwargs:
    ptype: streamplot
    color: black
    density: 3
