# Region 'yucatan'. Exported from legacy regions.py (git 5c7d746) by
# scripts/tools/export_regions_yaml.py. Edit freely — this file is now the
# source of truth for the defaults; MongoDB region_configs (the /regions
# editor) holds runtime overrides on top. Validated by regions_store.validate().
order: 1
name: Yucatan
folder: yucatan
extent: [-90, -78, 17, 29]
figure:
  legend:
    columns: 8
  figsize: [10, 7]
sea_surface_height:
- depth: 0
  limits: [-0.6, 0.7, 0.1]
eez: true
variables:
  salinity:
  - depth: 0
    limits: [35.8, 36.6, 0.1]
  - depth: 150
    limits: [36, 37, 0.05]
  temperature:
  - depth: 0
    limits: [24.5, 28.0, 0.25]
  - depth: 150
    limits: [18.0, 25.5, 0.5]
currents:
  bool: true
  depths: [0, 150]
  limits: [0, 1.5, 0.1]
  coarsen:
    rtofs: 5
    espc: 6
  kwargs:
    ptype: streamplot
    color: black
salinity_max:
  limits: [36, 37, 0.1]
ocean_heat_content:
  limits: [0, 160, 10]
