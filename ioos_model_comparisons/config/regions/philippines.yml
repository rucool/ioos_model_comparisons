# Region 'philippines'. Exported from legacy regions.py (git 5c7d746) by
# scripts/tools/export_regions_yaml.py. Edit freely — this file is now the
# source of truth for the defaults; MongoDB region_configs (the /regions
# editor) holds runtime overrides on top. Validated by regions_store.validate().
order: 22
name: Philippines Sea
folder: philippines_sea
extent: [110, 150, 5, 40]
figure:
  figsize: [12, 7]
  legend:
    columns: 9
sea_surface_height:
- depth: 0
  limits: [-0.6, 0.7, 0.1]
eez: false
variables:
  salinity:
  - depth: 0
    limits: [34.0, 36.5, 0.1]
  - depth: 200
    limits: [34.1, 35, 0.1]
  temperature:
  - depth: 0
    limits: [10, 29, 1]
  - depth: 200
    limits: [10, 21, 1]
currents:
  bool: true
  depths: [0, 1500]
  limits: [0, 1.0, 0.1]
  limits_by_depth:
    1500: [0, 0.4, 0.05]
  coarsen:
    rtofs: 14
    espc: 15
    cmems: 14
    amseas: 13
  kwargs:
    ptype: streamplot
    color: black
    density: 2.25
    linewidth: 0.5
salinity_max:
  limits: [36, 37.5, 0.1]
ocean_heat_content:
  limits: [0, 160, 10]
